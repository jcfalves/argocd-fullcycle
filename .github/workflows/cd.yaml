name: CD
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          username: jcfalves
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: jcfalves/argocd-fullcycle
          tags: ${{ github.sha }}, latest
   
